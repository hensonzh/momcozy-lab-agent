name: momcozy-lab-agent-local

x-runtime-service: &runtime-service
  image: momcozy-lab-agent:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${MOMCOZY_AGENT_ENV_FILE:-env/local.env}
  init: true

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: momcozy_agent_runtime
      POSTGRES_PASSWORD: momcozy_agent_runtime
      POSTGRES_USER: momcozy_agent_runtime
    ports:
      - "127.0.0.1:${MOMCOZY_AGENT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - runtime-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U momcozy_agent_runtime -d momcozy_agent_runtime",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${MOMCOZY_AGENT_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MOMCOZY_AGENT_MINIO_PORT:-9002}:9000"
    volumes:
      - runtime-minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/agent-runtime",
      ]
    restart: "no"

  migrate:
    <<: *runtime-service
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *runtime-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MOMCOZY_AGENT_API_BIND:-127.0.0.1:8010}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *runtime-service
    command: ["python", "-m", "app.workers.agent_run"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  runtime-postgres-data:
  runtime-minio-data:
