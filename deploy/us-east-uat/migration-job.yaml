# Separate pre-deployment Job template: use a unique name per release, wait for
# completion before deploying workloads, and block release on migration failure.
apiVersion: batch/v1
kind: Job
metadata:
  name: momcozy-agent-migrate-REPLACE_WITH_RELEASE_ID
  namespace: REPLACE_WITH_APPROVED_US_EAST_UAT_NAMESPACE
  labels: {app.kubernetes.io/part-of: momcozy-us-east-uat}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: REPLACE_WITH_AGENT_IMAGE_DIGEST
          command: [python, -m, alembic, -c, alembic.ini, upgrade, head]
          envFrom:
            - configMapRef: {name: momcozy-agent-uat-config}
            - secretRef: {name: momcozy-agent-migrate-uat-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
