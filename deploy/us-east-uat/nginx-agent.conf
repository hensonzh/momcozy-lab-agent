# B-only Agent Runtime. Install only after a publicly trusted certificate is
# present and the host-wide unknown-host policy is reviewed. It may temporarily
# return 502 before the B service starts; public readiness remains a post-deploy gate.
upstream momcozy_b_agent_api {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name agent-us-dev.lute-momcozylab.luteos.cloud;

    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 30s;
    ssl_certificate /etc/letsencrypt/live/agent-us-dev.lute-momcozylab.luteos.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-us-dev.lute-momcozylab.luteos.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MOMCOZY_B_AGENT_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/momcozy-b-agent.access.log;
    error_log /var/log/nginx/momcozy-b-agent.error.log warn;

    location ~ ^/v1/agent/runs/[^/]+/stream$ {
        proxy_pass http://momcozy_b_agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    location / {
        proxy_pass http://momcozy_b_agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        send_timeout 120s;
    }
}
