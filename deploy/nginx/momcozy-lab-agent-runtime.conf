# Momcozy Lab Agent Runtime (agent/) staging site.
# Host-wide unknown-host rejection belongs to the host Nginx configuration,
# not to an individual service site.
upstream momcozy_lab_agent_runtime {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name agent-test.lute-momcozylab.luteos.cloud;

    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 30s;

    ssl_certificate /etc/nginx/tls/momcozy-lab-staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/momcozy-lab-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MOMCOZY_AGENT_RUNTIME_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/momcozy-lab-agent-runtime.access.log;
    error_log /var/log/nginx/momcozy-lab-agent-runtime.error.log warn;

    location ~ ^/v1/agent/runs/[^/]+/stream$ {
        proxy_pass http://momcozy_lab_agent_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    location / {
        proxy_pass http://momcozy_lab_agent_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        send_timeout 120s;
    }
}
