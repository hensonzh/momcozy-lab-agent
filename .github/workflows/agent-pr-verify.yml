name: agent-pr-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and type-check production code
        run: |
          python -m ruff check app tests scripts
          python -m mypy app
      - name: Test and check runtime contracts
        run: |
          python -m pytest
          python scripts/export_runtime_contract_catalog.py --check
          python scripts/run_behavior_eval.py --validate-only --output-json /tmp/behavior-eval.json --junit /tmp/behavior-eval.xml
