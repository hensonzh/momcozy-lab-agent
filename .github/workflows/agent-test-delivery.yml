name: agent-test-delivery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy a proven main release or roll back to the previous release.
        required: true
        type: choice
        options:
          - deploy
          - rollback
      commit_sha:
        description: Full main-branch commit SHA; required for deploy.
        required: false
        type: string
      confirm_schema_compatible:
        description: Required for rollback; confirms old code can read the current schema.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: momcozy-lab-agent-test
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate the manual release operator
        env:
          TEST_APPROVERS: ${{ vars.TEST_APPROVERS }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a raw_approvers <<< "${TEST_APPROVERS}"
          normalized_approvers=","
          for raw_approver in "${raw_approvers[@]}"; do
            approver="${raw_approver//[[:space:]]/}"
            approver="$(printf '%s' "${approver}" | tr '[:upper:]' '[:lower:]')"
            [[ "${approver}" =~ ^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$ ]] || {
              echo "TEST_APPROVERS must be a comma-separated GitHub login allowlist." >&2
              exit 1
            }
            normalized_approvers+="${approver},"
          done
          [[ "${normalized_approvers}" != "," ]] || exit 1
          # A manual dispatch is the release decision. Re-runs must also be
          # initiated by an allowed operator; no second issue comment is needed.
          for actor in "${GITHUB_ACTOR}" "${GITHUB_TRIGGERING_ACTOR}"; do
            actor="$(printf '%s' "${actor}" | tr '[:upper:]' '[:lower:]')"
            [[ -n "${actor}" && "${normalized_approvers}" == *",${actor},"* ]] || {
              echo "The manual release operator is not in TEST_APPROVERS." >&2
              exit 1
            }
          done

  deliver:
    needs: authorize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: test
      url: https://agent-test.lute-momcozylab.luteos.cloud:8443
    env:
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      CONFIRM_SCHEMA_COMPATIBLE: ${{ inputs.confirm_schema_compatible }}
      TEST_RELEASE_ROOT: /opt/momcozy-lab
      TEST_ENV_FILE: /opt/momcozy-lab/shared/agent/deploy.env
      TEST_CA_FILE: /etc/nginx/tls/momcozy-ca/ca.pem
      TEST_PUBLIC_URL: https://agent-test.lute-momcozylab.luteos.cloud:8443
      PRODUCT_RELEASE_MANIFEST: /opt/momcozy-lab/current/backend/release-manifest.json
      TEST_RELEASE_LOCK: /opt/momcozy-lab/shared/test-release.lock
      REMOTE_RELEASE_TOOL: /tmp/momcozy-agent-release-tool-${{ github.run_id }}-${{ github.run_attempt }}.py
      REMOTE_DOCKER_CONFIG: /tmp/momcozy-agent-docker-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the trusted main release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the authoritative successful-CI image manifest
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.test_release import validate_commit_sha

          validate_commit_sha(os.environ["REQUESTED_COMMIT_SHA"])
          PY
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_COMMIT_SHA}^{commit}"
          git merge-base --is-ancestor "${REQUESTED_COMMIT_SHA}" origin/main

          ci_run_id="$(
            gh run list \
              --workflow agent-ci.yml \
              --branch main \
              --commit "${REQUESTED_COMMIT_SHA}" \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"
          [[ "${ci_run_id}" =~ ^[0-9]+$ ]]
          manifest_dir="${RUNNER_TEMP}/agent-ci-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${manifest_dir}"
          gh run download "${ci_run_id}" \
            --name "agent-image-manifest-${REQUESTED_COMMIT_SHA}" \
            --dir "${manifest_dir}"
          CI_MANIFEST_PATH="${manifest_dir}/agent-image-manifest.json" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.test_release import validate_commit_sha, validate_image_ref

          requested = validate_commit_sha(os.environ["REQUESTED_COMMIT_SHA"])
          payload = json.loads(Path(os.environ["CI_MANIFEST_PATH"]).read_text())
          image_ref = validate_image_ref(str(payload.get("image_ref", "")))
          expected = {
              "schema_version": 1,
              "service": "agent-runtime",
              "commit": requested,
              "image_digest": image_ref.rsplit("@", 1)[1],
          }
          observed = {key: payload.get(key) for key in expected}
          if observed != expected:
              raise SystemExit(f"CI image manifest identity mismatch: {observed}")
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"RELEASE_COMMIT_SHA={requested}\n")
              output.write(f"RELEASE_IMAGE_REF={image_ref}\n")
          PY

      - name: Validate rollback confirmation
        if: inputs.operation == 'rollback'
        run: |
          test "${CONFIRM_SCHEMA_COMPATIBLE}" = "true"

      - name: Configure verified SSH host access
        env:
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          install -m 0600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${TEST_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${TEST_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"

      - name: Authenticate the host to GHCR with an ephemeral token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          test -n "${GHCR_TOKEN}"
          printf '%s' "${GHCR_TOKEN}" | ssh -p "${TEST_SSH_PORT}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "install -d -m 0700 '${REMOTE_DOCKER_CONFIG}' && DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"

      - name: Install the trusted main release tool on the host
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          scp -P "${TEST_SSH_PORT}" scripts/test_release.py \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:${REMOTE_RELEASE_TOOL}"

      - name: Stage the exact commit without uncommitted files
        if: inputs.operation == 'deploy'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          archive="${RUNNER_TEMP}/agent-${RELEASE_COMMIT_SHA}.tar.gz"
          git archive --format=tar.gz --output "${archive}" "${RELEASE_COMMIT_SHA}"
          archive_sha256="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          remote_archive="/tmp/momcozy-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          scp -P "${TEST_SSH_PORT}" "${archive}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:${remote_archive}"
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "python3 '${REMOTE_RELEASE_TOOL}' stage-snapshot --archive '${remote_archive}' --archive-sha256 '${archive_sha256}' --commit-sha '${RELEASE_COMMIT_SHA}' --release-root '${TEST_RELEASE_ROOT}' --attempt-id '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Deploy the immutable runtime under the host lock
        if: inputs.operation == 'deploy'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          release_dir="${TEST_RELEASE_ROOT}/releases/agent/${RELEASE_COMMIT_SHA}"
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "/usr/bin/flock --exclusive --timeout 1800 '${TEST_RELEASE_LOCK}' env DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' python3 '${REMOTE_RELEASE_TOOL}' deploy --image-ref '${RELEASE_IMAGE_REF}' --commit-sha '${RELEASE_COMMIT_SHA}' --repo-dir '${release_dir}' --env-file '${TEST_ENV_FILE}' --release-root '${TEST_RELEASE_ROOT}' --public-url '${TEST_PUBLIC_URL}' --ca-file '${TEST_CA_FILE}' --product-manifest '${PRODUCT_RELEASE_MANIFEST}'"

      - name: Roll back application code without downgrading the database
        if: inputs.operation == 'rollback'
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "/usr/bin/flock --exclusive --timeout 1800 '${TEST_RELEASE_LOCK}' env DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' python3 '${REMOTE_RELEASE_TOOL}' rollback --env-file '${TEST_ENV_FILE}' --release-root '${TEST_RELEASE_ROOT}' --public-url '${TEST_PUBLIC_URL}' --ca-file '${TEST_CA_FILE}' --confirm-schema-compatible"

      - name: Remove ephemeral host registry credentials
        if: always()
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          ssh -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "DOCKER_CONFIG='${REMOTE_DOCKER_CONFIG}' docker logout ghcr.io >/dev/null 2>&1 || true; rm -f '${REMOTE_DOCKER_CONFIG}/config.json'; rmdir '${REMOTE_DOCKER_CONFIG}' 2>/dev/null || true" || true

      - name: Remove transient SSH material
        if: always()
        run: rm -f "${HOME}/.ssh/id_ed25519"
