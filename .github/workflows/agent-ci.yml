name: agent-ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests scripts/run_behavior_eval.py

      - name: Type-check
        run: python -m mypy app tests

      - name: Test
        run: python -m pytest

      - name: Validate behavior eval release contract
        run: |
          python -m pytest tests/test_behavior_eval_gate.py
          python scripts/run_behavior_eval.py \
            --validate-only \
            --output-json /tmp/behavior-eval.json \
            --junit /tmp/behavior-eval.xml

      - name: Verify operations CLI entrypoints
        run: |
          python scripts/check_product_backend_contract.py
          python scripts/check_product_backend_contract.py --help
          python scripts/run_behavior_eval.py --help
          python scripts/run_fact_extraction_worker.py --help
          python scripts/run_memory_consolidation.py --help
          python scripts/run_replay_eval.py --help

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: momcozy_agent_runtime
          POSTGRES_PASSWORD: momcozy_agent_runtime
          POSTGRES_USER: momcozy_agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momcozy_agent_runtime -d momcozy_agent_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://momcozy_agent_runtime:momcozy_agent_runtime@localhost:5432/momcozy_agent_runtime
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Apply fresh Runtime database baseline
        run: python -m alembic -c alembic.ini upgrade head

      - name: Reject ORM-to-database schema drift
        run: python -m alembic -c alembic.ini check

      - name: Verify isolated Runtime schema and owner scope
        run: python -m pytest tests/test_runtime_ledger_postgres.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp env/compose.local.env.example env/compose.local.env
          docker compose \
            -f docker-compose.local.yml \
            -f docker-compose.ci.yml \
            config --quiet

      - name: Validate production Compose configuration
        env:
          MOMCOZY_AGENT_IMAGE: agent:ci
          MOMCOZY_AGENT_ENV_FILE: env/compose.prod.env.example
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Compose image
        run: docker compose -f docker-compose.local.yml build api

      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' agent:local)" = "app"

      - name: Verify release contracts inside the image
        run: |
          docker run --rm agent:local \
            python scripts/check_product_backend_contract.py
          docker run --rm agent:local \
            python scripts/run_behavior_eval.py \
              --validate-only \
              --output-json /tmp/behavior-eval.json \
              --junit /tmp/behavior-eval.xml

      - name: Smoke-test migration-gated readiness
        run: |
          docker compose \
            -f docker-compose.local.yml \
            -f docker-compose.ci.yml \
            up \
            --detach \
            --wait \
            --wait-timeout 90 \
            api worker fact-worker
          curl --fail --silent http://127.0.0.1:8010/v1/health/ready >/dev/null

      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.local.yml \
            -f docker-compose.ci.yml \
            logs

      - name: Stop smoke stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.local.yml \
            -f docker-compose.ci.yml \
            down --volumes
