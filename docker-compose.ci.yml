# CI-only override. Use together with docker-compose.local.yml.
name: momcozy-lab-agent-ci

services:
  minio:
    image: momcozy-staging-minio:9e49d5e7a648f00e

  minio-init:
    image: momcozy-staging-minio:9e49d5e7a648f00e

  jwks:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/fixtures/jwks:/usr/share/nginx/html:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/.well-known/jwks.json",
        ]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    image: momcozy-lab-agent:ci
    environment:
      APP_ENV: test
      RUNTIME_RELEASE_ID: "0000000000000000000000000000000000000000"

  api:
    image: momcozy-lab-agent:ci
    environment:
      APP_ENV: test
      RUNTIME_RELEASE_ID: "0000000000000000000000000000000000000000"
      AUTH_JWKS_URL: http://jwks/.well-known/jwks.json
    depends_on:
      jwks:
        condition: service_healthy

  worker:
    image: momcozy-lab-agent:ci
    environment:
      APP_ENV: test
      RUNTIME_RELEASE_ID: "0000000000000000000000000000000000000000"
      OPENAI_API_KEY: ci-agent-runtime-openai-key
